[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "prelaunch-check"
version = "0.1.0"
description = "Read-only checks to run on a website before opening it to the public."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Marco Estrada" }]
dependencies = []

[project.scripts]
prelaunch-check = "prelaunch_check.__main__:main"

[tool.setuptools]
packages = ["prelaunch_check"]
